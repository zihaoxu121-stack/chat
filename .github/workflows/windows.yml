name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Unicode shortcut creation before packaging
        shell: pwsh
        run: ./scripts/test-shortcuts.ps1
      - name: Build Windows x64 installer
        run: npm run dist:win
      - name: Install, verify Unicode shortcuts, launch, uninstall and reinstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Calculate SHA256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $file = "ChatDraft-Setup-$version-x64.exe"
          $hash = Get-FileHash "release/$file" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $file" | Set-Content release/SHA256SUMS.txt
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatDraft-Windows-x64
          path: |
            release/ChatDraft-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/install-diagnostics/
          retention-days: 30
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "聊天话术助手 $version" --notes "修复中文快捷方式乱码及错误启动路径。已在 Windows runner 实际安装、通过快捷方式启动并验证卸载重装保留数据。安装包未签名；Windows 10 实机与真实 API 效果仍待验证。" --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "release/ChatDraft-Setup-$version-x64.exe" release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view preview --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete-asset preview ChatDraft-Setup-1.0.0-x64.exe --repo "$env:GITHUB_REPOSITORY" --yes 2>$null
            gh release edit preview --repo "$env:GITHUB_REPOSITORY" --title "旧版已撤回：请使用 1.0.1 或更新版本" --notes "1.0.0 的中文快捷方式编码有误，安装包已撤回。请从 Releases 下载 v1.0.1 或更新版本。"
          }
          exit 0
