name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows x64 installer
        run: npm run dist:win
      - name: Calculate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash release/ChatDraft-Setup-1.0.0-x64.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  ChatDraft-Setup-1.0.0-x64.exe" | Set-Content release/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDraft-Windows-x64
          path: |
            release/ChatDraft-Setup-1.0.0-x64.exe
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view preview --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create preview --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Windows 客户端预览版" --notes "本地档案与聊天拟稿助手。下载 Setup.exe 后双击安装；配置你自己的模型 API。安装包未签名，尚待 Windows 10 实机与真实模型验收。" --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload preview release/ChatDraft-Setup-1.0.0-x64.exe release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          exit $LASTEXITCODE
